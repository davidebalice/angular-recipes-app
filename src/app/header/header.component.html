<nav class="navbar navbar-expand-lg navbar-light headerContainer">
  <div class="container-fluid">
    <a class="logoContainer" href="#"
      ><img src="../../assets/images/logoWhite.png" class="logo" />
      <br />
      <p class="logoText">Recipe Book</p></a
    >

    <img src="../../assets/images/logoDbWhite.png" class="logoDb" />

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 navbarNav">
        <li class="nav-item navButton" routerLink="/home">
          <mat-icon>home</mat-icon>
          <a class="nav-link" routerLinkActive="active" aria-current="page"
            >Home</a
          >
        </li>
        <li class="nav-item navButton" routerLink="/recipes">
          <mat-icon>menu_book</mat-icon>
          <a
            class="nav-link"
            routerLinkActive="active"
            aria-current="page"
            
            >Recipes</a
          >
        </li>
        <li class="nav-item navButton" routerLink="/recipes/new">
          <mat-icon>add_circle</mat-icon>
          <a
            class="nav-link"
            routerLinkActive="active"
            aria-current="page"
            
            >Add recipe</a
          >
        </li>

        <li
          class="nav-item navButton categoryButton"
          (mouseenter)="showCategories()"
          (mouseleave)="hideCategories()"
        >
          <mat-icon>list</mat-icon>
          <a class="nav-link" aria-current="page"
            >Categories
            <app-categories
              *ngIf="isCategoriesVisible"
              (mouseenter)="showCategories()"
              (mouseleave)="hideCategories()"
            ></app-categories
          ></a>
        </li>
        <li class="nav-item navButton" routerLink="/shopping-list">
          <mat-icon>local_mall</mat-icon>
          <a class="nav-link" >Shopping List</a>
        </li>
      </ul>


      <div *ngIf="isLoggedIn">
        <button (click)="onLogout()"><mat-icon>logout</mat-icon></button>
      </div>
      <form class="d-flex" (ngSubmit)="onSearch(searchInput.value)">
        <input
          #searchInput
          class="form-control me-2"
          type="search"
          placeholder="Search"
          aria-label="Search"
        />
        <button class="btn btn-outline-success" type="submit"><mat-icon>search</mat-icon></button>
      </form>
    </div>
  </div>
</nav>
