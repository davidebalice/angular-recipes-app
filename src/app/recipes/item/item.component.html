<div class="card cardRecipe">
  <div class="row g-0">
    <div
      class="categoryContainer"
      [ngStyle]="{ 'background-color': '#' + recipe.categoryDto.bg }"
    >
      {{ recipe.categoryDto.name }}
    </div>

    <div class="imgContainer">
      <img
        [src]="getFullImageUrl(recipe.imageUrl)"
        alt="{{ recipe.title }}"
        class="imgRecipe"
      />
    </div>

    <div class="card-body cardBody">
      <h4 class="cardTitle">{{ recipe.title }}</h4>
      <div class="cardInfo">
        <div>
          <span class="cardDifficulty">Difficulty:</span>
          <br />
          <ng-container
            *ngFor="let icon of generateStarsArray(recipe.difficulty)"
          >
            <mat-icon class="starIcon">{{ icon }}</mat-icon>
          </ng-container>
        </div>
        <div>
          <span class="cardDifficulty">Preparation time:</span>
          <br />
          <div class="scheduleContainer">
            <mat-icon class="clockIcon">schedule</mat-icon>
            <span class="">{{ recipe.preparationTime }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer cardFooter">
      <button class="btn btn-success" (click)="onSelected()">Detail</button>
      <button class="btn btn-success" (click)="onPhotoRecipe(recipe.id)">
        Photo
      </button>
      <button class="btn btn-danger" (click)="onDeleteRecipe(recipe.id)">
        Delete
      </button>
    </div>
  </div>
</div>
