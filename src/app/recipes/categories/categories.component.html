<div class="row">
  <div class="col-md-3">
    <div class="list-group">
      <p
        class="list-group-item list-group-item-action"
        [ngClass]="{ active: selectedCategory === category }"
        *ngFor="let category of categories"
        (click)="onSelectCategory(category)"
      >
        {{ category.name }}
      </p>
    </div>
  </div>
</div>
