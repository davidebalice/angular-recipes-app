<div class="row">
  <div class="col-xs-12">
    <button class="btn btn-success" (click)="onNewRecipe()">New Recipe</button>
  </div>
</div>

<hr />

<div class="row">
  <div class="col-xs-12">
    <ng-container *ngIf="loadedRecipes.length > 0; else noRecipes">
      <app-item
        *ngFor="let recipeItem of loadedRecipes"
        [recipe]="recipeItem"
      ></app-item>
    </ng-container>
    <ng-template #noRecipes>
      <div>No recipes available.</div>
    </ng-template>
    <div *ngIf="isLoading">loading...</div>
  </div>
</div>
