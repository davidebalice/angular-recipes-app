<div class="row">
  <div class="col-12">
    <ng-container *ngIf="loadedRecipes.length > 0; else noRecipes">
      <div class="row">
        <div
          class="col-12 col-md-4 mb-3"
          *ngFor="let recipeItem of loadedRecipes"
        >
          <app-card [recipe]="recipeItem"></app-card>
        </div>
      </div>
    </ng-container>

    <div class="customPagination" *ngIf="pagination && totalItems > limit">
      <pagination
        [totalItems]="totalItems"
        [(ngModel)]="currentPage"
        [itemsPerPage]="limit"
        (pageChanged)="onPageChanged($event)"
        [maxSize]="5"
        boundaryLinks="true"
      >
      </pagination>
    </div>

    <ng-template #noRecipes>
      <div class="noRecipes">No recipes available.</div>
    </ng-template>

    <div *ngIf="isLoading" class="loadingContainer">
      <img src="../../../assets/images/loading.svg" />
    </div>
  </div>
</div>
