<div class="row">
  <div class="col-xs-12">
    <button class="btn btn-success" (click)="onNewRecipe()">
      <mat-icon> add_circle </mat-icon>
      <p>New Recipe</p>
    </button>
  </div>
</div>

<hr />

<div class="row">
  <div class="col-12">
    <ng-container *ngIf="loadedRecipes.length > 0; else noRecipes">
      <div class="row">
        <div
          class="col-12 col-md-4 mb-4"
          *ngFor="let recipeItem of loadedRecipes"
        >
          <app-item [recipe]="recipeItem"></app-item>
        </div>
      </div>
    </ng-container>
    <ng-template #noRecipes>
      <div>No recipes available.</div>
    </ng-template>
    <div *ngIf="isLoading">loading...</div>
  </div>
</div>
