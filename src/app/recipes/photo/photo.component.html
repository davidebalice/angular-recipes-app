<app-demo-modal (close)="closeDemoModal()"></app-demo-modal>
<div class="container" *ngIf="recipe$ | async as recipe; else loading">
  <div class="page">
    <div class="pageTitle">Photo of Recipe</div>
    <div class="pageTop">
      <button
        class="btn btn-primary buttonCard buttonBack"
        (click)="onBackRecipes()"
      >
        < Back
      </button>
    </div>

    <div class="row">
      <form *ngIf="recipeForm" [formGroup]="recipeForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-xs-12">
            <div class="title">
              {{ recipe.title }}
            </div>
          </div>
        </div>

        <div class="row">
          <div class="form-group uploadContainer">
            <input
              type="file"
              id="image"
              formControlName="image"
              name="image"
              class="form-control inputUpload"
              #image
              accept="image/*"
              (change)="uploadImage($event)"
            />
            <button type="submit" class="btn btn-success buttonCard">
              <mat-icon>publish</mat-icon>
              Upload file
            </button>
          </div>
        </div>
        <div class="row">
          <div class="col-xs-12 mt-5">
            <img [src]="getFullImageUrl(imageUrl)" class="image" />
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<ng-template #loading>
  <p>Loading...</p>
</ng-template>
