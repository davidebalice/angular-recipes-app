<div class="container">
  <div class="page">
    <div class="pageTitle">Shopping list of Ingredients</div>
    <div [style.display]="new || edit ? 'block' : 'none'">
      <app-shopping-edit (closeForm)="handleCloseForm()"></app-shopping-edit>
    </div>
    <button (click)="onShowAdd()"><mat-icon>add</mat-icon></button>

    <mat-icon>print</mat-icon>
    <hr />
    <ul class="list-group">
      <p>list</p>
      <div
        class="list-group-item"
        *ngFor="let ingredient of shoppingList; let i = index"
      >
        <a style="cursor: pointer">
          {{ ingredient.title }} ({{ ingredient.quantity }})
        </a>

        <mat-icon (click)="onEditItem(ingredient.id)">edit</mat-icon>
        <mat-icon (click)="onDeleteItem(ingredient.id)">delete</mat-icon>
      </div>
    </ul>
  </div>
</div>
