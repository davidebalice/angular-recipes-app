<div class="row">
  <div class="col-xs-10">
    <app-shopping-edit></app-shopping-edit>
    <hr />
    <ul class="list-group">
      <p>list</p>
      <a
        class="list-group-item"
        style="cursor: pointer"
        *ngFor="let ingredient of shoppingList; let i = index"
        (click)="onEditItem(i)"
      >
        {{ ingredient.title }} ({{ ingredient.quantity }})
      </a>
    </ul>
  </div>
</div>
