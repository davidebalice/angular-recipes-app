<app-demo-modal (close)="closeDemoModal()"></app-demo-modal>
<div class="container" id="printSection">
  <div class="page">
    <div class="pageTitle">Shopping list of Ingredients</div>
    <div [style.display]="new || edit ? 'block' : 'none'" class="noPrint">
      <app-shopping-edit (closeForm)="handleCloseForm()"></app-shopping-edit>
    </div>
    <div class="buttonContainer noPrint">
      <button (click)="onShowAdd()" class="buttonCard buttonSl">
        <mat-icon>add_circle</mat-icon><span> Add ingredient</span>
      </button>
      <button class="buttonCard buttonSl" (click)="printPage()">
        <mat-icon>print</mat-icon><span>Print list</span>
      </button>
    </div>

    <ul class="list-group">
      <div class="listRow listRowTitle">
        <div>Ingredients</div>
        <div>Quantity</div>
        <div class="noPrint">Manage</div>
      </div>

      <div
        class="list-group-item"
        *ngFor="let ingredient of shoppingList; let i = index"
      >
        <div class="listRow">
          <div>
            {{ ingredient.title }}
          </div>
          <div>
            {{ ingredient.quantity }}
          </div>
          <div class="listButtonContainer noPrint">
            <mat-icon (click)="onEditItem(ingredient.id)" class="buttonEdit"
              >edit</mat-icon
            >
            <mat-icon (click)="onDeleteItem(ingredient.id)" class="buttonDelete"
              >delete</mat-icon
            >
          </div>
        </div>
      </div>
    </ul>
  </div>
</div>
