<div class="row">
  <div class="col-xs-12">
    <form (ngSubmit)="onSubmit(f)" #f="ngForm">
      <br />
      <div class="row">
        <div class="col-sm-5 form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="title"
            name="title"
            class="form-control"
            ngModel
            required
          />
        </div>
        <div class="col-sm-2 form-group">
          <label for="amount">Quantity</label>
          <input
            type="number"
            id="quantity"
            name="quantity"
            class="form-control"
            ngModel
            required
            pattern="[1-9]\d*"
          />
        </div>
      </div>


      <input type="hidden" id="id" name="id"  ngModel  />


      <div class="row">
        <div class="col-xs-12 buttonContainer">
          <button class="btn btn-success" type="submit" [disabled]="!f.valid">
            {{ editMode ? "Update" : "Add" }}
          </button>


  
          <button
            class="btn btn-primary"
            type="button"
            (click)="onResetItem(f)"
          >
            Reset
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
